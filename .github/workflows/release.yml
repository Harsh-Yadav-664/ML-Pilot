name: Release

# Publishes the Python package to PyPI and the Docker image to GHCR when a version tag is pushed
# (issue #68):   git tag v0.1.0 && git push origin v0.1.0
# The tag must equal `mlpilot.__version__` (backend/mlpilot/__init__.py). Nothing here runs on
# pull requests or branches. One-time setup that only the maintainer can do:
#   - PyPI: add this repository and workflow as a trusted publisher of the project "mlpilot"
#     (https://docs.pypi.org/trusted-publishers/), and create the GitHub environment "pypi".
#   - GHCR: nothing; the image is pushed with the workflow's own GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The tag is the package version
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('backend/mlpilot/__init__.py').read_text()).group(1))")
          echo "package version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build the UI, the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          (cd frontend && npm ci)
          python scripts/build_ui.py
          python -m build --outdir dist backend
          ls -l dist
      - name: Install the wheel in a clean virtualenv and start it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/mlpilot --version
          venv/bin/python -I -c "from app.core.ui import ui_index; assert ui_index() is not None, 'the wheel has no UI'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
