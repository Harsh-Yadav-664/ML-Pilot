name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      # Critical rules only (syntax errors, undefined names). The full rule set
      # still reports ~280 pre-existing style errors; those need their own cleanup issue.
      - name: Lint (ruff, critical rules)
        run: ruff check . --select E9,F63,F7,F82
      # Includes tests/integration/test_agent_loop_telecom.py: baseline + 2 agent
      # iterations on telecom_churn.csv with the offline stub provider.
      - name: Tests (stub LLM provider, no network keys)
        run: pytest -q
      - name: Planted-leak suite (prints leakage precision/recall)
        run: python -m tests.fixtures.leakage.suite

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
