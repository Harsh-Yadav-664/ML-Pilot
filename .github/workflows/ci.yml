name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres for the connection tests (tests/fixtures/postgres.py). The tests fail,
    # not skip, in CI when it is missing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mlpilot_ci
          POSTGRES_PASSWORD: ci-password-71c9e4
          POSTGRES_DB: mlpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlpilot_ci -d mlpilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MLPILOT_TEST_PG_HOST: localhost
      MLPILOT_TEST_PG_PORT: "5432"
      MLPILOT_TEST_PG_USER: mlpilot_ci
      MLPILOT_TEST_PG_PASSWORD: ci-password-71c9e4
      MLPILOT_TEST_PG_DB: mlpilot_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Full configured rule set (pyproject.toml), including AGENTS.md rule 8:
      # no try-except-pass, no blind `except Exception` without a recorded reason.
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      # Includes tests/integration/test_agent_loop_telecom.py: baseline + 2 agent
      # iterations on telecom_churn.csv with the offline stub provider.
      - name: Tests (stub LLM provider, no network keys)
        run: pytest -q
      - name: 1M-row CSV load and profile (prints the timing, must stay under 10 s)
        run: pytest -q -s tests/unit/test_duckdb_engine.py::test_a_million_row_csv_loads_and_profiles_in_under_ten_seconds
      - name: Demo database (prints the table checksums and the recency AUC)
        run: pytest -q -s -p no:logging tests/unit/test_demo_db.py -k "checksums or recency_feature or default_size"
      - name: SQL guard against Postgres (prints the refused hostile queries and can_write)
        run: pytest -q -s -p no:logging tests/integration/test_sql_guard_postgres.py
      - name: Schema graph on the demo database (prints foreign keys found and inferred precision/recall)
        run: pytest -q -s -p no:logging tests/unit/test_schema_graph.py tests/integration/test_schema_graph_postgres.py -k "declared or inferred"
      - name: Column statistics (prints the pandas comparison and the 5M-row sampling times)
        run: pytest -q -s -p no:logging tests/unit/test_db_stats.py tests/integration/test_db_stats_postgres.py -k "matches_pandas or five_million or one_row_per_group"
      - name: Planted-leak suite (prints leakage precision/recall)
        run: python -m tests.fixtures.leakage.suite
      - name: Leakage canaries (prints the canary report, one line per trap and the layer that catches it)
        run: pytest -q -s -p no:logging tests/integration/test_canaries.py
      # The OpenAPI schema is the frontend's contract (frontend/openapi.json).
      - name: API contract is up to date
        run: python -m scripts.export_openapi --check

  # The demo database as Docker ships it (issue #47): `docker compose up demo-db`, then psql as
  # the read-only role and the integration test against it.
  demo-db:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker/demo-db/docker-compose.yml
      MLPILOT_DEMO_PG_HOST: 127.0.0.1
      MLPILOT_DEMO_PG_PORT: "5433"
      MLPILOT_DEMO_PG_DB: demo
      # The documented demo defaults of docker/demo-db/docker-compose.yml (fake data, localhost only).
      MLPILOT_DEMO_PG_RO_USER: mlpilot_ro
      MLPILOT_DEMO_PG_RO_PASSWORD: mlpilot_demo_ro
      MLPILOT_DEMO_PG_RW_USER: mlpilot_rw
      MLPILOT_DEMO_PG_RW_PASSWORD: mlpilot_demo_rw
      # The container's superuser (POSTGRES_USER of the compose file, same documented demo default):
      # the pilot-role test needs it to create a role.
      MLPILOT_DEMO_PG_ADMIN_USER: demo_admin
      MLPILOT_DEMO_PG_ADMIN_PASSWORD: mlpilot_demo_admin
      MLPILOT_DEMO_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up demo-db (waits until the schema, data and roles are loaded)
        run: $COMPOSE up -d --build --wait --wait-timeout 600 demo-db
      - name: psql as mlpilot_ro lists the tables; an INSERT fails
        run: |
          psql_ro() { $COMPOSE exec -T -e PGPASSWORD=mlpilot_demo_ro demo-db psql -h 127.0.0.1 -U mlpilot_ro -d demo "$@"; }
          psql_ro -c '\dt'
          psql_ro -tc 'SELECT count(*) AS customers FROM customers'
          if out=$(psql_ro -c "INSERT INTO products VALUES (999999, 'x', 'y', 1)" 2>&1); then
            echo "INSERT as mlpilot_ro unexpectedly succeeded: $out"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'permission denied'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Integration test against the compose service (tables, roles, recency AUC)
        working-directory: backend
        run: pytest -q -s -p no:logging tests/integration/test_demo_db_compose.py
      # The pilot kit (#103): docs/pilot/readonly_role.sql run with psql as the container's superuser.
      # The new role can SELECT its tables only, cannot write, has the statement timeout and the
      # connection limit; lock and drop end its sessions and remove it.
      - name: Pilot kit read-only role SQL on the demo Postgres (prints what the role can and cannot do)
        working-directory: backend
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version
          pytest -q -s -p no:logging tests/integration/test_pilot_role.py
      # A run on the compose database, exported; score.py reads the same database as the
      # read-only role through pg8000 and must reproduce the validation PR-AUC within 1e-6.
      - name: Export bundle on the demo Postgres reproduces the validation metric
        working-directory: backend
        run: pytest -q -s -p no:logging tests/integration/test_export_bundle.py -k demo_postgres
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The UI against the compose database: connect as both demo roles, graph, table details,
      # time-column toggle, write-role warning (screenshot uploaded as an artifact).
      - name: Connect-a-database UI test (Playwright, python start.py, demo Postgres)
        working-directory: frontend
        env:
          PYTHON: python
          MLPILOT_E2E_PG_HOST: ${{ env.MLPILOT_DEMO_PG_HOST }}
          MLPILOT_E2E_PG_PORT: ${{ env.MLPILOT_DEMO_PG_PORT }}
          MLPILOT_E2E_PG_DB: ${{ env.MLPILOT_DEMO_PG_DB }}
          MLPILOT_E2E_PG_RO_USER: ${{ env.MLPILOT_DEMO_PG_RO_USER }}
          MLPILOT_E2E_PG_RO_PASSWORD: ${{ env.MLPILOT_DEMO_PG_RO_PASSWORD }}
          MLPILOT_E2E_PG_RW_USER: ${{ env.MLPILOT_DEMO_PG_RW_USER }}
          MLPILOT_E2E_PG_RW_PASSWORD: ${{ env.MLPILOT_DEMO_PG_RW_PASSWORD }}
          MLPILOT_E2E_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$MLPILOT_E2E_SCREENSHOT_DIR"
          npx playwright test --project=features --no-deps connect.spec.ts
      # A question in plain words becomes a task (#53): draft, label preview, confirm, on a DuckDB
      # copy of the demo database the test generates (the offline stub, so the rules draft it). The
      # editor test (#99) builds the churn task by hand, changes the horizon and confirms. The run test
      # (#101) starts a run from the confirmed task and compares the page's numbers with the API's.
      - name: Ask-a-question, task editor and run view UI tests (Playwright, python start.py)
        working-directory: frontend
        env:
          PYTHON: python
          MLPILOT_E2E_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$MLPILOT_E2E_SCREENSHOT_DIR"
          npx playwright test --project=features --no-deps task.spec.ts editor.spec.ts run.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-ui
          path: |
            screenshots/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Container log (on failure)
        if: failure()
        run: $COMPOSE logs --no-color demo-db | tail -100

  # Optional engine: AutoGluon (Apache-2.0) is large, so this job may fail or be
  # slow without blocking the PR. It runs the same e2e test with AutoGluon.
  autogluon-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and AutoGluon
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "autogluon.tabular>=1.2"
      - name: E2E test with AutoGluon (presets=medium_quality, time_limit=60 per fit)
        env:
          MLPILOT_E2E_ENGINE: AutoGluon
        run: pytest -q -s tests/integration/test_engine_e2e.py

  # Measures how often a real model drafts the expected spec for 10 demo questions (#53). Runs
  # only when an LLM API key secret exists, never blocks (the number is a measurement).
  nl-accuracy:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Question to spec accuracy (prints one line per question and the count)
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        run: python -m scripts.nl_accuracy

  # Measures how many of a real model's feature proposals pass the checks on the demo churn task
  # (#56, target 70 percent). Runs only when an LLM API key secret exists, never blocks.
  export:
    # #61: export a run, install the bundle in a clean virtualenv, reproduce the validation
    # metric with the bundle's own score.py, and compile its dbt project (dbt-duckdb).
    runs-on: ubuntu-latest
    env:
      EXPORT_DIR: ${{ github.workspace }}/export-out
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run and export the demo task (writes the unzipped bundle and a DuckDB copy of its data)
        working-directory: backend
        env:
          MLPILOT_EXPORT_DIR: ${{ env.EXPORT_DIR }}
        run: pytest -q -s -p no:logging tests/integration/test_export_bundle.py -k from_the_database
      - name: Clean virtualenv, install only the bundle's requirements.txt, run score.py --verify
        run: |
          bundle=$(ls -d "$EXPORT_DIR"/mlpilot_export_*)
          python -m venv "$RUNNER_TEMP/bundle-venv"
          "$RUNNER_TEMP/bundle-venv/bin/pip" install -q -r "$bundle/requirements.txt"
          MLPILOT_DB_URL="duckdb:///$EXPORT_DIR/data.duckdb" \
            "$RUNNER_TEMP/bundle-venv/bin/python" "$bundle/score.py" --verify
      - name: dbt compile on the bundle's dbt project
        run: |
          bundle=$(ls -d "$EXPORT_DIR"/mlpilot_export_*)
          python -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install -q dbt-duckdb
          cd "$bundle/dbt"
          "$RUNNER_TEMP/dbt-venv/bin/dbt" compile --profiles-dir . --project-dir . --vars '{cutoff: "2025-01-01"}'
          test -f target/compiled/mlpilot_features/models/features_all.sql

  feature-proposals:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Feature proposal pass rate (prints one line per proposal and the rate)
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        run: python -m scripts.feature_proposal_rate 20

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TS types are generated from frontend/openapi.json; stale types fail here.
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale: run 'npm run gen:api' and commit it"; exit 1; }
      - run: npm run build
      - run: npx tsc --noEmit

  # Real backend (stub LLM, throwaway DB) + real UI in Chromium: sample data -> baseline.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: UI smoke test (python start.py on a fresh clone, no token set up)
        working-directory: frontend
        run: |
          test ! -e ~/.mlpilot/token && test ! -e .env.local
          npm run test:smoke
      - name: The generated token stays out of git
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
