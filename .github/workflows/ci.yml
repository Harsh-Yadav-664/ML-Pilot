name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      # Critical rules only (syntax errors, undefined names). The full rule set
      # still reports ~280 pre-existing style errors; those need their own cleanup issue.
      - name: Lint (ruff, critical rules)
        run: ruff check . --select E9,F63,F7,F82
      # Includes tests/integration/test_agent_loop_telecom.py: baseline + 2 agent
      # iterations on telecom_churn.csv with the offline stub provider.
      - name: Tests (stub LLM provider, no network keys)
        run: pytest -q
      - name: Planted-leak suite (prints leakage precision/recall)
        run: python -m tests.fixtures.leakage.suite

  # Optional engine: AutoGluon (Apache-2.0) is large, so this job may fail or be
  # slow without blocking the PR. It runs the same e2e test with AutoGluon.
  autogluon-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and AutoGluon
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "autogluon.tabular>=1.2"
      - name: E2E test with AutoGluon (presets=medium_quality, time_limit=60 per fit)
        env:
          MLPILOT_E2E_ENGINE: AutoGluon
        run: pytest -q -s tests/integration/test_engine_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
