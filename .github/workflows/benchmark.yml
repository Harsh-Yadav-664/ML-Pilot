# The RelBench benchmark (issue #65). Manual only: it downloads a dataset and takes minutes to
# hours, so it never runs on push or pull request. Numbers exist only in this run's artifact.
name: Benchmark

on:
  # TEMPORARY, removed before this branch is final: a workflow that is not on the default branch
  # cannot be dispatched, so the branch runs it on push while it is being developed.
  push:
    branches: [claude/project-thread-ihmial-65]
  workflow_dispatch:
    inputs:
      dataset:
        description: RelBench dataset
        default: rel-f1
      task:
        description: RelBench task
        default: driver-dnf
      methods:
        description: "Methods: a entity-table LightGBM, b DFS + LightGBM, c agent (cheap model), d agent (strong model)"
        default: a b c d
      seeds:
        description: Seeds
        default: 0 1 2
      cheap_model:
        description: "provider:model for method c (needs that provider's key as a repository secret); empty runs c on the offline stub"
        default: ""
      strong_model:
        description: "provider:model for method d; empty skips d"
        default: ""

permissions:
  contents: read

jobs:
  relbench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # An unset secret is an empty string, which the gateway treats as "no key".
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MLPILOT_BENCH_CHEAP_MODEL: ${{ inputs.cheap_model }}
      MLPILOT_BENCH_STRONG_MODEL: ${{ inputs.strong_model }}
      DATASET: ${{ inputs.dataset || 'rel-f1' }}
      TASK: ${{ inputs.task || 'driver-dnf' }}
      METHODS: ${{ inputs.methods || 'a b c d' }}
      SEEDS: ${{ inputs.seeds || '0 1 2' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            benchmarks/requirements.txt
      - name: Install dependencies (backend, RelBench)
        run: |
          python -m pip install --upgrade pip
          pip install -r benchmarks/requirements.txt
          pip show relbench | grep -E '^(Name|Version|License)'
      - name: Lint the harness (ruff, mypy)
        working-directory: backend
        run: |
          ruff check . ../benchmarks
          ruff format --check . ../benchmarks
          mypy
      # The data-independent parts on a tiny dataset in RelBench's format, scored by RelBench's evaluator.
      - name: Harness tests (stub provider, no network)
        working-directory: backend
        run: pytest -q -p no:logging tests/unit/test_relbench_harness.py
      - name: Download the dataset and task
        run: |
          python - <<'PY'
          import os
          import relbench
          ds = relbench.load_dataset("stanford-star/relbench-v1/" + os.environ["DATASET"])
          task = ds.load_task(os.environ["TASK"])
          db = task.get_db()
          print(ds, task, {k: len(v) for k, v in db.table_dict.items()})
          print({s: len(task.get_table(s)) for s in ("train", "val", "test")})
          PY
      - name: make benchmark
        run: make benchmark DATASET="$DATASET" TASK="$TASK" METHODS="$METHODS" SEEDS="$SEEDS"
      - name: Results table
        if: always()
        run: test -f benchmarks/RESULTS.md && cat benchmarks/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relbench-results
          path: |
            benchmarks/results/
            benchmarks/RESULTS.md
          if-no-files-found: warn
