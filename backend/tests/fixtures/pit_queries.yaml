# Feature queries with the point-in-time guard's expected outcome (tests/unit/test_pit_guard.py).
# expect: accepted | rewritten | rejected
# codes: reason codes that must appear (rejected)       contains: text the rewritten SQL must hold
# static: tables confirmed static in the schema         leaky: the query really reads the future;
#                                                       the runtime check must catch it too
# Tables of the demo database: customers(signup_at) orders(ordered_at) refunds(refunded_at)
# sessions(started_at) support_tickets(opened_at) marketing_emails(sent_at);
# order_items and products have no event time.

# ---- accepted ----------------------------------------------------------------------------
- id: basic_count
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
    GROUP BY l.entity_id, l.cutoff_time

- id: lookback_window_and_upper_bound
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, coalesce(sum(o.total), 0) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id
      AND o.ordered_at >= l.cutoff_time - INTERVAL '30 days'
      AND o.ordered_at < l.cutoff_time
    GROUP BY l.entity_id, l.cutoff_time

- id: bound_in_where_inner_join
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(*) AS value
    FROM __labels l JOIN orders o ON o.customer_id = l.entity_id
    WHERE o.ordered_at < l.cutoff_time AND o.status = 'completed'
    GROUP BY l.entity_id, l.cutoff_time

- id: lte_minus_interval
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id
      AND o.ordered_at <= l.cutoff_time - INTERVAL '1 day'
    GROUP BY l.entity_id, l.cutoff_time

- id: reversed_comparison
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id AND l.cutoff_time > o.ordered_at
    GROUP BY l.entity_id, l.cutoff_time

- id: timestamp_casts_on_both_sides
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id
      AND CAST(o.ordered_at AS TIMESTAMP) < CAST(l.cutoff_time AS TIMESTAMP)
    GROUP BY l.entity_id, l.cutoff_time

- id: cte_joined_on_entity_and_cutoff
  expect: accepted
  sql: |
    WITH a AS (
      SELECT l.entity_id, l.cutoff_time, count(*) AS n
      FROM __labels l JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
      GROUP BY l.entity_id, l.cutoff_time)
    SELECT l.entity_id, l.cutoff_time, coalesce(a.n, 0) AS value
    FROM __labels l
    LEFT JOIN a ON a.entity_id = l.entity_id AND a.cutoff_time = l.cutoff_time

- id: derived_table_joined_on_cutoff
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, coalesce(d.s, 0) AS value
    FROM __labels l
    LEFT JOIN (
      SELECT x.entity_id, x.cutoff_time, sum(r.amount) AS s
      FROM __labels x JOIN refunds r ON r.customer_id = x.entity_id AND r.refunded_at < x.cutoff_time
      GROUP BY x.entity_id, x.cutoff_time) d
      ON d.entity_id = l.entity_id AND d.cutoff_time = l.cutoff_time

- id: correlated_scalar_subquery
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time,
      (SELECT max(o.total) FROM orders o
        WHERE o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time) AS value
    FROM __labels l

- id: exists_subquery
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time,
      EXISTS (SELECT 1 FROM refunds r
              WHERE r.customer_id = l.entity_id AND r.refunded_at < l.cutoff_time) AS value
    FROM __labels l

- id: scalar_subquery_with_limit_is_per_row
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time,
      (SELECT o.total FROM orders o
        WHERE o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
        ORDER BY o.ordered_at DESC LIMIT 1) AS value
    FROM __labels l

- id: nested_correlated_subqueries
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time,
      (SELECT count(*) FROM orders o
        WHERE o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
          AND o.total > (SELECT avg(o2.total) FROM orders o2
                          WHERE o2.customer_id = l.entity_id AND o2.ordered_at < l.cutoff_time)) AS value
    FROM __labels l

- id: in_subquery_bounded
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
    WHERE o.order_id IN (SELECT r.order_id FROM refunds r
                          WHERE r.customer_id = l.entity_id AND r.refunded_at < l.cutoff_time)
    GROUP BY l.entity_id, l.cutoff_time

- id: window_function_partitioned_by_cutoff
  expect: accepted
  sql: |
    WITH ranked AS (
      SELECT l.entity_id, l.cutoff_time, o.total,
             row_number() OVER (PARTITION BY l.entity_id, l.cutoff_time ORDER BY o.ordered_at DESC) AS rn
      FROM __labels l JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time)
    SELECT l.entity_id, l.cutoff_time, r.total AS value
    FROM __labels l
    LEFT JOIN ranked r ON r.entity_id = l.entity_id AND r.cutoff_time = l.cutoff_time AND r.rn = 1

- id: self_join_of_an_event_table
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(*) AS value
    FROM __labels l
    JOIN orders o1 ON o1.customer_id = l.entity_id AND o1.ordered_at < l.cutoff_time
    JOIN orders o2 ON o2.customer_id = l.entity_id AND o2.ordered_at < l.cutoff_time
                  AND o2.ordered_at > o1.ordered_at
    GROUP BY l.entity_id, l.cutoff_time

- id: entity_table_is_bounded_too
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    JOIN customers c ON c.customer_id = l.entity_id AND c.signup_at < l.cutoff_time
    LEFT JOIN orders o ON o.customer_id = c.customer_id AND o.ordered_at < l.cutoff_time
    GROUP BY l.entity_id, l.cutoff_time

- id: static_tables_are_an_assumption
  expect: accepted
  static: [order_items, products]
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(i.order_item_id) AS value
    FROM __labels l
    JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
    JOIN order_items i ON i.order_id = o.order_id
    JOIN products p ON p.product_id = i.product_id AND p.category = 'books'
    GROUP BY l.entity_id, l.cutoff_time

- id: case_when_inside_an_aggregate
  expect: accepted
  sql: |
    SELECT l.entity_id, l.cutoff_time,
           sum(CASE WHEN o.status = 'cancelled' THEN 1 ELSE 0 END) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id AND o.ordered_at < l.cutoff_time
    GROUP BY l.entity_id, l.cutoff_time

- id: postgres_syntax
  expect: accepted
  dialect: postgres
  runnable: false
  sql: |
    SELECT l.entity_id, l.cutoff_time, count(o.order_id) AS value
    FROM __labels l
    LEFT JOIN orders o ON o.customer_id = l.entity_id
      AND o.ordered_at::timestamp < l.cutoff_time::timestamp
      AND o.ordered_at >= l.cutoff_time - INTERVAL '90 days'
    GROUP BY l.entity_id, l.cutoff_time

