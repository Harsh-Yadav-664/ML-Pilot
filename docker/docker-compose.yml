version: "3.9"

# Ports are published on 127.0.0.1 only: MLPilot is a local tool by default.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlpilot
      POSTGRES_PASSWORD: mlpilot_dev
      POSTGRES_DB: mlpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Synthetic e-commerce database for demos and tests (issue #47): `docker compose up demo-db`.
  # Roles: mlpilot_ro (read only) and mlpilot_rw (can write, to test the privilege warning).
  # The passwords below are documented demo values for fake data on localhost; override them
  # with DEMO_RO_PASSWORD / DEMO_RW_PASSWORD / DEMO_ADMIN_PASSWORD.
  demo-db:
    build:
      context: ./demo-db
    environment:
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: ${DEMO_ADMIN_PASSWORD:-mlpilot_demo_admin}
      POSTGRES_DB: demo
      DEMO_RO_PASSWORD: ${DEMO_RO_PASSWORD:-mlpilot_demo_ro}
      DEMO_RW_PASSWORD: ${DEMO_RW_PASSWORD:-mlpilot_demo_rw}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      # The server only listens on TCP after the init scripts (schema, data, roles) are done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mlpilot_ro -d demo"]
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://mlpilot:mlpilot_dev@db:5432/mlpilot
      LOG_LEVEL: INFO
      DEBUG: "false"
      # Inside the container the API listens on all interfaces; the port is published
      # on localhost only. Every API call needs this token (openssl rand -hex 32).
      MLPILOT_HOST: 0.0.0.0
      MLPILOT_TOKEN: ${MLPILOT_TOKEN:?set MLPILOT_TOKEN to a random value of 16+ characters}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - artifacts:/app/artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  artifacts:
