# MLPilot (API and web UI in one image) next to the synthetic demo database (issue #68):
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Then read the address from the log (`docker compose -f docker/docker-compose.yml logs mlpilot`):
# it ends in "#token=...", the local access token. In the UI connect to host `demo-db`, port 5432,
# database `demo`, user `mlpilot_ro`, password `mlpilot_demo_ro` (documented demo values for fake
# data, see docker/demo-db/README.md). The same from a terminal:
#
#   docker compose -f docker/docker-compose.yml exec -e DEMO_PW=mlpilot_demo_ro mlpilot \
#       mlpilot connect --name demo --host demo-db --database demo --user mlpilot_ro --password-env DEMO_PW
#
# Ports are published on 127.0.0.1 only: MLPilot is a local tool by default. To use your own token
# instead of the generated one, export MLPILOT_TOKEN (16+ characters) before `up`.

include:
  - demo-db/docker-compose.yml

services:
  mlpilot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mlpilot
    restart: unless-stopped
    environment:
      - MLPILOT_TOKEN # passed through only when it is set in your shell
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mlpilot-data:/data
    depends_on:
      demo-db:
        condition: service_healthy

volumes:
  mlpilot-data:
